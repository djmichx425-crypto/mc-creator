<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Gradientów — Enchant</title>
<style>
  :root {
    --bg-0: #0a0a0c;
    --bg-1: #131318;
    --bg-2: #1a1a21;
    --panel: #101014;
    --line: #23232b;
    --line-bright: #33333e;
    --text: #f2f2f5;
    --text-dim: #8b8b96;
    --accent: #2f6bff;
    --accent-dim: #1f4fd6;
    --grid: #0e0e12;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    background-color: var(--bg-0);
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  header .tag {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px 2px rgba(47,107,255,0.5);
    flex-shrink: 0;
  }

  h1 {
    font-size: 19px;
    letter-spacing: -0.01em;
    margin: 0;
    font-weight: 800;
    color: var(--text);
  }

  header .sub {
    color: var(--text-dim);
    font-size: 12.5px;
    letter-spacing: 0.01em;
  }

  .layout {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 22px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    position: relative;
  }

  .panel::before { content: none; }

  .panel-inner { padding: 20px; }

  .panel-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }

  .panel-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* --- PREVIEW --- */
  .preview-stage {
    position: sticky;
    top: 20px;
  }
  @media (max-width: 860px) {
    .preview-stage { position: static; }
  }

  .checker {
    background-image:
      linear-gradient(45deg, #202024 25%, transparent 25%),
      linear-gradient(-45deg, #202024 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #202024 75%),
      linear-gradient(-45deg, transparent 75%, #202024 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #16161b;
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    min-height: 140px;
  }

  #textPreview {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 0.02em;
    word-break: break-all;
    text-align: center;
  }

  .ingame-preview {
    margin-top: 16px;
    padding: 14px 16px;
    background: #2b2b2b;
    border: 1px solid #111;
    border-radius: 10px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ingame-preview #chatPreviewText {
    text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
    font-weight: bold;
  }

  .ingame-preview .rest {
    color: #aaa;
  }

  .ingame-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    width: 100%;
    margin-bottom: 2px;
  }

  /* --- FORM CONTROLS --- */
  .field {
    margin-bottom: 18px;
  }

  .field:last-child { margin-bottom: 0; }

  label.flabel {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 7px;
  }

  input[type=text] {
    width: 100%;
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.01em;
  }
  input[type=text]:focus {
    outline: none;
    border-color: var(--accent);
  }

  .preset-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .preset-row button {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text-dim);
    padding: 6px 11px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .preset-row button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .preset-row .swatch {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    flex-shrink: 0;
  }

  /* Color group / gradient bar — same visual pattern as rank generator's color-group */
  .color-group {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    background: var(--bg-1);
  }
  .color-group-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .color-group-head .name {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text);
    font-weight: 600;
  }
  .color-group-head .count {
    font-size: 10px;
    color: var(--text-dim);
  }

  .bar-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .bar-controls button {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text-dim);
    padding: 6px 10px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
  }
  .bar-controls button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .gradient-bar-wrap {
    position: relative;
    height: 30px;
    margin: 22px 4px 30px;
  }
  .gradient-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: copy;
  }
  .stop-handle {
    position: absolute;
    top: 15px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid #0a0a0c;
    box-shadow: 0 0 0 1px var(--text-dim);
    transform: translate(-50%, -50%);
    cursor: grab;
  }
  .stop-handle.active { box-shadow: 0 0 0 2px var(--accent); }
  .stop-handle:active { cursor: grabbing; }
  .stop-pct-label {
    position: absolute;
    top: 15px;
    margin-top: 14px;
    transform: translateX(-50%);
    font-size: 9.5px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .stops {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stop-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stop-row input[type=color] {
    width: 34px;
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: none;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
  }
  .stop-row input[type=text].hex {
    width: 84px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text-dim);
    padding: 6px 8px;
    font-size: 12px;
    font-family: inherit;
    flex-shrink: 0;
  }
  .stop-row input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }
  .stop-row .pct {
    font-size: 11px;
    color: var(--accent);
    width: 36px;
    text-align: right;
    flex-shrink: 0;
  }
  .stop-row button.rm {
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text-dim);
    width: 28px;
    height: 30px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    flex-shrink: 0;
  }
  .stop-row button.rm:hover {
    border-color: #e5484d;
    color: #e5484d;
  }

  .add-stop {
    background: none;
    border: 1px dashed var(--line-bright);
    border-radius: 8px;
    color: var(--text-dim);
    padding: 7px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
  }
  .add-stop:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Format grid */
  .format-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .format-grid button {
    background: var(--bg-1);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
  }
  .format-grid button:hover { border-color: var(--line-bright); }
  .format-grid button.active { border-color: var(--accent); background: var(--bg-2); }
  .format-grid .fname { font-size: 12px; font-weight: bold; margin-bottom: 3px; }
  .format-grid .fsyntax { font-size: 10px; color: var(--text-dim); font-family: monospace; }

  .output-code {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    font-size: 12px;
    word-break: break-all;
    color: var(--text);
    line-height: 1.6;
    max-height: 200px;
    overflow-y: auto;
    margin-top: 14px;
  }

  .export-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.01em;
    cursor: pointer;
    margin-top: 14px;
    transition: background 0.12s, transform 0.05s;
  }
  .export-btn:active {
    transform: translateY(1px);
  }
  .export-btn:hover { background: var(--accent-dim); }
  .export-btn.copied { background: var(--accent-dim); }

  .hint {
    font-size: 10.5px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-top: 6px;
  }

  ::selection { background: var(--accent-dim); color: #fff; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="tag"></div>
    <div>
      <h1>Generator Gradientów</h1>
      <div class="sub">kolory RGB tekstu · MiniMessage / Hex / Spigot / JSON</div>
    </div>
  </header>

  <div class="layout">

    <!-- PREVIEW -->
    <div class="preview-stage">
      <div class="panel">
        <div class="panel-inner">
          <p class="panel-title">Podgląd</p>
          <div class="checker">
            <div id="textPreview"></div>
          </div>

          <div class="ingame-preview">
            <div class="ingame-label">Podgląd w chacie</div>
            <span id="chatPreviewText"></span>
            <span class="rest">: siema ekipa</span>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:16px;">
        <div class="panel-inner">
          <p class="panel-title">Format wyjściowy</p>
          <div class="format-grid" id="formatGrid"></div>
          <div class="output-code" id="outputCode"></div>
          <button class="export-btn" id="copyBtn">Kopiuj format</button>
        </div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div>

      <div class="panel">
        <div class="panel-inner">
          <p class="panel-title">Treść</p>

          <div class="field">
            <label class="flabel">Tekst</label>
            <input type="text" id="inputText" value="BLASTCODE" maxlength="64">
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:16px;">
        <div class="panel-inner">
          <p class="panel-title">Gradient</p>

          <div class="color-group">
            <div class="color-group-head">
              <span class="name">Pasek gradientu</span>
              <span class="count" id="stopCount">3/8</span>
            </div>

            <div class="bar-controls">
              <button id="reverseBtn">⇄ Odwróć</button>
              <button id="equalizeBtn">≡ Wyrównaj</button>
            </div>

            <div class="gradient-bar-wrap">
              <div class="gradient-bar" id="gradientBar"></div>
              <div id="handlesLayer"></div>
            </div>

            <div class="stops" id="stopsList"></div>

            <button class="add-stop" id="addStopBtn">+ Dodaj kolor</button>
          </div>

          <div class="hint">Przeciągaj pinezki myszką lub kliknij na pasku, żeby dodać kolor. Maks. 8 punktów.</div>
        </div>
      </div>

      <div class="panel" style="margin-top:16px;">
        <div class="panel-inner">
          <p class="panel-title">Gotowe palety</p>
          <div class="preset-row" id="presetsGrid"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  const MAX_STOPS = 8;
  const MIN_STOPS = 2;

  const state = {
    text: 'BLASTCODE',
    stops: [
      { color: '#FF007F', pos: 0 },
      { color: '#7F00FF', pos: 50 },
      { color: '#00F0FF', pos: 100 },
    ],
    activeStop: 0,
    format: 'minimessage',
  };

  const PRESETS = {
    'Neon Cyber':   ['#FF00E5', '#7F00FF', '#00F0FF'],
    'Sunset':       ['#FF8C00', '#FF3D68', '#FFD700'],
    'Fire Flame':   ['#FF4500', '#FF8C00', '#FFD700'],
    'Ocean Breeze': ['#0077FF', '#00C2FF', '#7FFFD4'],
    'Emerald':      ['#00FF7F', '#00C853', '#00695C'],
    'Amethyst':     ['#9C27B0', '#BA68C8', '#E91E8C'],
    'Toxic Acid':   ['#00FF00', '#7FFF00', '#00C853'],
    'Sakura':       ['#FFB7CE', '#FF69B4', '#FFD1E8'],
    'Gold King':    ['#FFD700', '#FFA500', '#FFEC8B'],
    'Rainbow':      ['#FF0000', '#FFFF00', '#00FF00', '#00FFFF', '#0000FF', '#FF00FF'],
    'Ice Blue':     ['#00BFFF', '#87CEFA', '#E0FFFF'],
    'Vampire':      ['#8B0000', '#B22222', '#2B0000'],
  };

  const FORMATS = {
    minimessage: {
      name: 'MiniMessage',
      desc: '<gradient:#c1:#c2>Text</gradient>',
      build: (text, stops) => {
        const cols = [...stops].sort((a,b)=>a.pos-b.pos).map(s => s.color.toUpperCase()).join(':');
        return `<gradient:${cols}>${text}</gradient>`;
      }
    },
    hex: {
      name: 'Hex RGB (&#)',
      desc: '&#RRGGBBText',
      build: (text, stops) => perCharColors(text, stops).map(([ch, hex]) => `&#${hex.replace('#','')}${ch}`).join('')
    },
    spigot: {
      name: 'Spigot &x',
      desc: '&x&r&r&g&g&b&bText',
      build: (text, stops) => perCharColors(text, stops).map(([ch, hex]) => {
        const h = hex.replace('#','');
        return `&x${h.split('').map(c => `&${c}`).join('')}${ch}`;
      }).join('')
    },
    section: {
      name: 'Section §x',
      desc: '§x§r§r§g§g§b§bText',
      build: (text, stops) => perCharColors(text, stops).map(([ch, hex]) => {
        const h = hex.replace('#','');
        return `§x${h.split('').map(c => `§${c}`).join('')}${ch}`;
      }).join('')
    },
    cmi: {
      name: 'CMI / Essentials',
      desc: '{#HEX}Text',
      build: (text, stops) => perCharColors(text, stops).map(([ch, hex]) => `{${hex.toUpperCase()}}${ch}`).join('')
    },
    json: {
      name: 'JSON / Tellraw',
      desc: '[{"text":"...","color":"..."}]',
      build: (text, stops) => {
        const parts = perCharColors(text, stops).map(([ch, hex]) => ({ text: ch, color: hex.toUpperCase() }));
        return JSON.stringify(parts, null, 2);
      }
    },
  };

  function hexToRgb(hex){
    hex = hex.replace('#','');
    return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
  }
  function colorAt(stops, t){
    const sorted = [...stops].sort((a,b) => a.pos - b.pos);
    if (t <= sorted[0].pos) return sorted[0].color;
    if (t >= sorted[sorted.length-1].pos) return sorted[sorted.length-1].color;
    for (let i = 0; i < sorted.length - 1; i++){
      const a = sorted[i], b = sorted[i+1];
      if (t >= a.pos && t <= b.pos){
        const span = b.pos - a.pos || 1;
        const localT = (t - a.pos) / span;
        const [r1,g1,b1] = hexToRgb(a.color);
        const [r2,g2,b2] = hexToRgb(b.color);
        return rgbToHex(r1+(r2-r1)*localT, g1+(g2-g1)*localT, b1+(b2-b1)*localT);
      }
    }
    return sorted[sorted.length-1].color;
  }
  function perCharColors(text, stops){
    const chars = text.split('');
    const n = chars.length;
    return chars.map((ch, i) => {
      const t = n <= 1 ? 0 : (i / (n - 1)) * 100;
      return [ch, colorAt(stops, t)];
    });
  }
  function cssGradientString(stops){
    const sorted = [...stops].sort((a,b) => a.pos - b.pos);
    return `linear-gradient(90deg, ${sorted.map(s => `${s.color} ${s.pos}%`).join(', ')})`;
  }
  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderBar(){
    const bar = document.getElementById('gradientBar');
    bar.style.background = cssGradientString(state.stops);

    const layer = document.getElementById('handlesLayer');
    layer.innerHTML = '';
    state.stops.forEach((s, i) => {
      const handle = document.createElement('div');
      handle.className = 'stop-handle' + (i === state.activeStop ? ' active' : '');
      handle.style.left = s.pos + '%';
      handle.style.background = s.color;
      handle.dataset.i = i;

      const pctLabel = document.createElement('div');
      pctLabel.className = 'stop-pct-label';
      pctLabel.textContent = Math.round(s.pos) + '%';
      pctLabel.style.left = s.pos + '%';

      handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        state.activeStop = i;
        const barRect = bar.getBoundingClientRect();
        function onMove(ev){
          let pct = ((ev.clientX - barRect.left) / barRect.width) * 100;
          pct = Math.max(0, Math.min(100, pct));
          state.stops[i].pos = pct;
          renderAll();
        }
        function onUp(){
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
        renderStopsList();
      });

      layer.appendChild(handle);
      layer.appendChild(pctLabel);
    });

    document.getElementById('stopCount').textContent = `${state.stops.length}/${MAX_STOPS}`;
  }

  function renderStopsList(){
    const list = document.getElementById('stopsList');
    list.innerHTML = '';
    const sorted = state.stops.map((s, i) => ({...s, origIndex: i})).sort((a,b) => a.pos - b.pos);

    sorted.forEach(s => {
      const i = s.origIndex;
      const row = document.createElement('div');
      row.className = 'stop-row';
      row.innerHTML = `
        <input type="color" value="${s.color}" data-i="${i}">
        <input type="text" class="hex" value="${s.color.toUpperCase()}" data-i="${i}" maxlength="7">
        <input type="range" min="0" max="100" step="1" value="${Math.round(s.pos)}" data-i="${i}">
        <span class="pct">${Math.round(s.pos)}%</span>
        <button class="rm" data-i="${i}" ${state.stops.length <= MIN_STOPS ? 'style="visibility:hidden"' : ''}>×</button>
      `;
      list.appendChild(row);
    });

    list.querySelectorAll('input[type=color]').forEach(inp => {
      inp.addEventListener('input', () => {
        const i = +inp.dataset.i;
        state.stops[i].color = inp.value;
        renderAll();
      });
    });
    list.querySelectorAll('input.hex').forEach(inp => {
      inp.addEventListener('input', () => {
        const i = +inp.dataset.i;
        const v = inp.value.trim();
        if (/^#?[0-9a-fA-F]{6}$/.test(v)){
          state.stops[i].color = v.startsWith('#') ? v : '#' + v;
          renderAll();
        }
      });
    });
    list.querySelectorAll('input[type=range]').forEach(inp => {
      inp.addEventListener('input', () => {
        const i = +inp.dataset.i;
        state.stops[i].pos = +inp.value;
        renderAll();
      });
    });
    list.querySelectorAll('button.rm').forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.stops.length <= MIN_STOPS) return;
        state.stops.splice(+btn.dataset.i, 1);
        state.activeStop = 0;
        renderAll();
      });
    });
  }

  function renderTextPreview(){
    const preview = document.getElementById('textPreview');
    const chat = document.getElementById('chatPreviewText');
    const pairs = perCharColors(state.text || ' ', state.stops);
    const html = pairs.map(([ch, hex]) =>
      `<span style="color:${hex}">${ch === ' ' ? '&nbsp;' : escapeHtml(ch)}</span>`
    ).join('');
    preview.innerHTML = html;
    chat.innerHTML = html;
  }

  function renderPresets(){
    const grid = document.getElementById('presetsGrid');
    grid.innerHTML = '';
    Object.entries(PRESETS).forEach(([name, colors]) => {
      const btn = document.createElement('button');
      btn.innerHTML = `<span class="swatch" style="background:linear-gradient(90deg, ${colors.join(',')});"></span>${name}`;
      btn.addEventListener('click', () => {
        state.stops = colors.map((c, i) => ({
          color: c,
          pos: colors.length === 1 ? 0 : (i / (colors.length - 1)) * 100
        }));
        state.activeStop = 0;
        renderAll();
      });
      grid.appendChild(btn);
    });
  }

  function renderFormatGrid(){
    const grid = document.getElementById('formatGrid');
    grid.innerHTML = '';
    Object.entries(FORMATS).forEach(([key, f]) => {
      const btn = document.createElement('button');
      btn.className = key === state.format ? 'active' : '';
      btn.innerHTML = `<div class="fname">${f.name}</div><div class="fsyntax">${escapeHtml(f.desc)}</div>`;
      btn.addEventListener('click', () => {
        state.format = key;
        renderFormatGrid();
        renderOutput();
      });
      grid.appendChild(btn);
    });
  }

  function renderOutput(){
    const f = FORMATS[state.format];
    const code = f.build(state.text || ' ', state.stops);
    document.getElementById('outputCode').textContent = code;
  }

  function renderAll(){
    renderBar();
    renderStopsList();
    renderOutput();
    renderTextPreview();
  }

  document.getElementById('inputText').addEventListener('input', (e) => {
    state.text = e.target.value;
    renderOutput();
    renderTextPreview();
  });

  document.getElementById('gradientBar').addEventListener('click', (e) => {
    if (state.stops.length >= MAX_STOPS) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = ((e.clientX - rect.left) / rect.width) * 100;
    state.stops.push({ color: colorAt(state.stops, pct), pos: pct });
    state.activeStop = state.stops.length - 1;
    renderAll();
  });

  document.getElementById('addStopBtn').addEventListener('click', () => {
    if (state.stops.length >= MAX_STOPS) return;
    state.stops.push({ color: colorAt(state.stops, 50), pos: 50 });
    state.activeStop = state.stops.length - 1;
    renderAll();
  });

  document.getElementById('reverseBtn').addEventListener('click', () => {
    state.stops = state.stops.map(s => ({ ...s, pos: 100 - s.pos }));
    renderAll();
  });

  document.getElementById('equalizeBtn').addEventListener('click', () => {
    const n = state.stops.length;
    const sorted = [...state.stops].sort((a,b) => a.pos - b.pos);
    sorted.forEach((s, i) => { s.pos = n === 1 ? 0 : (i / (n - 1)) * 100; });
    state.stops = sorted;
    renderAll();
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    const code = document.getElementById('outputCode').textContent;
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = 'Skopiowano!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
    });
  });

  renderAll();
  renderPresets();
  renderFormatGrid();
})();
</script>
</body>
</html>
